server.port=${PORT:8080}
server.shutdown=graceful

spring.application.name=scalelink-url-shortener

# ==============================================================================
# Java 21 Project Loom: Virtual Threads enable karne se har incoming request
# ek lightweight Virtual Thread me execute hoti hai (carrier OS thread block nahi hota).
# 10,000+ concurrent redirects par bhi memory under 200MB rehti hai.
# ==============================================================================
spring.threads.virtual.enabled=true

# ==============================================================================
# Multi-Environment Database Support:
# 1. Render par: DATABASE_URL auto-inject hota hai (PostgreSQL).
# 2. Local par: Agar koi DB env var nahi hai toh H2 in-memory par chalega.
#    Iska fayda: Koi bhi developer bina Docker/DB start kiye 'mvn spring-boot:run'
#    karega aur project turant chal padega!
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:shortenerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==============================================================================
# Redis L2 Distributed Cache (Optional / Plug & Play):
# Agar Upstash ya Render Redis ka REDIS_URL present ho toh L2 cache active hoga.
# Agar Redis connect na ho, toh application bina crash hue gracefully L1 Caffeine
# cache par switch kar leti hai (Graceful Degradation).
# ==============================================================================
# spring.data.redis.url is set automatically via REDIS_URL if non-empty
# By omitting the empty fallback, we avoid Lettuce throwing 'Invalid Redis URL empty string'
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1500ms

# ==============================================================================
# ScaleLink Custom Architecture Properties
# ==============================================================================
scalelink.base-url=${BASE_URL:http://localhost:8080}

# Range ID Allocation (KGS Pattern):
# Har server pod startup par DB se itne IDs ka block atomically reserve karega.
# Isse 10,000 requests tak DB ko touch bhi nahi karna padta ID generate karne ke liye!
scalelink.id-generator.range-block-size=10000

# Bloom Filter Negative Cache Barrier:
# Expected keys and False Positive Probability (1% FPP consumes ~1.2MB RAM for 1M keys)
scalelink.bloom-filter.expected-insertions=1000000
scalelink.bloom-filter.fpp=0.01

# L1 Caffeine In-Memory Cache:
# Sub-millisecond redirect serving directly from JVM heap
scalelink.cache.l1-max-size=50000
scalelink.cache.l1-expire-minutes=30

# Async Analytics Buffer:
# Redirect ke waqt sync DB write latency kill karta hai. Bounded queue + Virtual thread batching.
scalelink.analytics.queue-capacity=50000
scalelink.analytics.batch-size=200
scalelink.analytics.flush-interval-ms=2000

# Abuse Defense / Rate Limiting (Token Bucket per IP)
scalelink.rate-limit.shorten-per-minute=30
scalelink.rate-limit.redirect-per-second=200
